# Netlify — marketing landing + Flutter web app
# Connect this GitHub repo in Netlify. Publish directory is `site`.

[build]
  publish = "site"

[[redirects]]
  from = "/privacy"
  to = "/privacy/"
  status = 301

[[redirects]]
  from = "/terms"
  to = "/terms/"
  status = 301

[[redirects]]
  from = "/app"
  to = "/app/"
  status = 301

# Flutter uses hash routes (/app/#/today). This only kicks in when a real
# file is missing, so /app/main.dart.js still serves as a static asset.
[[redirects]]
  from = "/app/*"
  to = "/app/index.html"
  status = 200
